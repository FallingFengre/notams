# FIR/ICAO配置，填写你需要获取的航警所在的飞行情报区（FIR）代码或机场ICAO代码
[ICAO]
codes = ZBPE ZGZU ZHWH ZJSA ZLHW ZPKM ZSHA ZWUQ ZYSH VVTS WSJC WIIF YMMM WMFC RPHI AYPM AGGG ANAU NFFF KZAK VYYF VCCF VOMF WAAF RJJJ RCAA YBBB VVGL VVHN VVHM RCSP WIIF
[SERVER]
host = 127.0.0.1
port = 5000
browser_mode = true
[WEBVIEW]
host = 127.0.0.1
port = 5000

# Playwright 浏览器会话配置（用于绕过 FAA 站点 Akamai 拦截）
# channel: auto 自动检测系统浏览器 / chrome / msedge / chromium
# window_x/window_y: 把后台 Chrome 窗口移出屏幕（如 -32000,-32000）
# page_wait_seconds: 打开页面后等待 Akamai challenge 完成的时间（秒）
# max_retries: 请求失败后的重试次数
[PLAYWRIGHT]
channel = auto
window_x = -32000
window_y = -32000
page_wait_seconds = 10
max_retries = 3